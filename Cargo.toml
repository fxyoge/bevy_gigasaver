[package]
name = "bevy_gigasaver"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Typed, benchmark-driven SQLite saves for Bevy"
license = "MIT OR Apache-2.0"

[dependencies]
bevy_gigasaver_macros = { path = "macros" }
inventory = "0.3"
bevy_app = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std", "serialize"] }
bevy_transform = { version = "0.20.0", features = ["serialize"] }
bevy_asset = "0.20.0"
bevy_time = { version = "0.20.0", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
divan = "0.1.21"
tempfile = "3"

[[bench]]
name = "snapshot"
harness = false

[[bench]]
name = "changed"
harness = false

[[bench]]
name = "explicit_dirty"
harness = false

[[bench]]
name = "mixed"
harness = false

[[bench]]
name = "lifecycle"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
