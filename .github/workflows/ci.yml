name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Formatting, Clippy, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      with:
        key: quality
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Build documentation
      run: cargo doc --locked --no-deps

  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        rust: [ stable ]
        include:
        - os: ubuntu-latest
          rust: '1.95'
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install Rust
      run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      with:
        key: test
    - name: Run tests and doctests
      run: cargo test --locked
    - name: Smoke-test benchmarks
      run: cargo test --locked --benches
